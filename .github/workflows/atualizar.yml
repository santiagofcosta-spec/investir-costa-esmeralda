name: Atualizar dados (FipeZap, CUB, Banco Central, soja, Cepea) e alertas

on:
  schedule:
    # todo dia útil às 19h de Brasília (22h UTC): soja muda todo dia; FipeZap/CUB só mudam quando sai dado novo
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf==5.1.0
      - run: python scripts/atualizar.py
      - name: Alertas (dado vencido e notícias de Porto Belo)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/alertas.py
      - name: Salvar se algo mudou
        run: |
          if git diff --quiet -- dados/ && [ -z "$(git ls-files --others --exclude-standard dados/)" ]; then
            echo "Nenhum dado novo."
          else
            git config user.name "robo-atualizador"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dados/
            git commit -m "Atualiza dados automaticamente ($(date +%d/%m/%Y))"
            # alguém pode ter enviado mudança enquanto o robô rodava: junta antes de enviar.
            # O commit do robô só tem arquivos de dados/; em conflito neles vale a versão do robô (a mais nova).
            # Se não conseguir enviar, a rodada FALHA (aparece vermelha no GitHub e manda e-mail).
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
            [ "$ok" = 1 ] || { echo "Não consegui salvar os dados no GitHub."; exit 1; }
          fi
