name: Monitor da soja (aviso no WhatsApp)

on:
  schedule:
    # de hora em hora, das 7h às 18h de Brasília (10h às 21h UTC), dias úteis; a rodada das 18h manda o resumo
    - cron: "5 10-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: monitor-soja
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # o que já foi visto fica guardado no cache do GitHub (não vai para o site público)
      - uses: actions/cache/restore@v4
        with:
          path: estado
          key: monitor-soja-${{ github.run_id }}
          restore-keys: monitor-soja-
      - name: Olhar ofertas e avisar
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python scripts/monitor_soja.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: estado
          key: monitor-soja-${{ github.run_id }}
